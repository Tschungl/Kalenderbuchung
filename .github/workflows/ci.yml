name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kalender
          POSTGRES_PASSWORD: kalender
          POSTGRES_DB: kalender
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kalender"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kalender:kalender@localhost:5432/kalender
      AUTH_SECRET: ci-secret-nur-fuer-tests
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma migrate deploy
      - name: Typen prüfen
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src --quiet
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Docker-Image bauen
        run: docker build -t kalenderbuchung:ci .
